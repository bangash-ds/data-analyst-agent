[project]
name = "data-analyst-agent"
version = "0.1.0"
description = "End-to-end AI Data Analyst Agent using LangChain"
readme = "README.md"
authors = [
    { name = "Obaid Ullah", email = "uetfreelance99@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.4.9",
    "langchain-groq>=1.1.3",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "seaborn>=0.13.2",
]

[project.scripts]
data-analyst-agent = "data_analyst_agent:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
